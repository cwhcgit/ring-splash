<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#d93a4b">
<meta name="mobile-web-app-capable" content="yes">
<title>Ring Splash</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2a0f1c;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  .ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(20,6,14,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:5}
  .hidden{display:none!important}
  .panel{background:linear-gradient(#fff8ee,#ffe9d2);color:#5a1e2b;border-radius:28px;
    padding:22px 34px;text-align:center;box-shadow:0 10px 0 #b8283a,0 18px 40px rgba(0,0,0,.4);
    max-width:min(560px,86vw);max-height:86vh;overflow:auto}
  h1{margin:0 0 4px;font-size:44px;letter-spacing:1px;color:#d93a4b;text-shadow:0 3px 0 #ffd23f}
  h2{margin:0 0 8px;font-size:32px;color:#d93a4b}
  p{margin:6px 0 12px;font-size:16px;line-height:1.35}
  button{font:inherit;font-weight:700;border:0;border-radius:16px;padding:10px 18px;margin:5px;
    background:#3a86ff;color:#fff;box-shadow:0 4px 0 #1f5ad1;cursor:pointer;font-size:17px}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #1f5ad1}
  button.big{font-size:24px;padding:12px 40px;background:#ff3b5c;box-shadow:0 5px 0 #b8283a}
  button:disabled{background:#c9b7b0;box-shadow:0 4px 0 #a39089;color:#f3ece8}
  #levels{display:flex;flex-wrap:wrap;justify-content:center;margin:6px 0 8px}
  #levels button{width:74px;padding:8px 0;font-size:20px;line-height:1.1}
  #levels small{display:block;font-size:12px;color:#ffd23f;letter-spacing:1px;min-height:14px}
  #menuBtn{position:fixed;top:max(6px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    z-index:4;width:52px;height:40px;padding:0;margin:0;border-radius:14px;font-size:18px;
    background:rgba(255,255,255,.22);box-shadow:none}
  #stars{font-size:52px;letter-spacing:6px;color:#ffc61a;text-shadow:0 3px 0 #c98a00;margin:4px 0}
  #stars .off{color:#e2d2c8;text-shadow:none}
  #rotate{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
    flex-direction:column;background:#d93a4b;font-size:24px;font-weight:700;text-align:center;padding:30px}
  #rotate .ph{width:60px;height:100px;border:5px solid #fff;border-radius:12px;margin-bottom:24px;
    animation:rot 2s ease-in-out infinite}
  @keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait){body:not(.playing) #rotate{display:flex}}
  .hint{font-size:13px;opacity:.75}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="menuBtn" class="hidden" aria-label="Menu">❚❚</button>

<div id="title" class="ov">
  <div class="panel">
    <h1>Ring Splash</h1>
    <p>Tap the <b>left</b> and <b>right</b> sides to pump: each press squirts one burst of water.<br>
       <b>Tilt</b> the phone to steer the rings. Hook every ring on a peg!</p>
    <div id="levels"></div>
    <button id="playBtn" class="big">Play</button>
    <p class="hint"><span id="ver"></span> · Keyboard: A / L pump · hold ← → to turn the tank · Esc menu</p>
  </div>
</div>

<div id="menu" class="ov hidden">
  <div class="panel">
    <h2>Paused</h2>
    <button id="resumeBtn" class="big">Resume</button><br>
    <button id="restartBtn">Restart level</button>
    <button id="levelsBtn">Levels</button><br>
    <button id="calBtn">Set level tilt here</button>
    <button id="tiltBtn">Tilt: On</button>
    <button id="flipBtn">Flip tilt</button>
    <button id="soundBtn">Sound: On</button>
    <p class="hint" id="tiltInfo"></p>
  </div>
</div>

<div id="win" class="ov hidden">
  <div class="panel">
    <h2 id="winTitle">Level clear!</h2>
    <div id="stars"></div>
    <p id="winStats"></p>
    <button id="nextBtn" class="big">Next</button><br>
    <button id="againBtn">Replay</button>
    <button id="winLevelsBtn">Levels</button>
  </div>
</div>

<div id="rotate"><div class="ph"></div>Turn your phone sideways</div>

<script>
"use strict";
const VERSION = "v0.9";   // bump on every push so testers can see which build they have
// ---------- World constants ----------
const W = 1600, H = 900;
const TANK = { x: 170, y: 84, w: 1260, h: 770 };
const BOT = TANK.y + TANK.h;
const R = 46, HOLE = 28, TH = 13, PEGW = 7;
const G = 400, DRAG = 2.1;
let JET = 6500;
const JET_W0 = 62, JET_SPREAD = 0.22, JET_REACH = 330;   // core width at the nozzle, how fast it widens, how far it carries
const BURST = 0.35, REFILL = 0.3;   // seconds of water per press, and to refill
const K = 2.6;                   // vertical squash for ring-ring collisions
const NOZ = [TANK.x + TANK.w * 0.2, TANK.x + TANK.w * 0.8];
const PEGCOL = ['#ff3b5c', '#3a86ff', '#ffc61a', '#2ec46b'];   // red, blue, yellow, green
const NEUTRAL_IN_COLOUR = ['#ffffff', '#c9b6ff'];   // any-colour rings, when coloured rings share the tank
const RCOL = ['#ffd23f', '#3bceac', '#ff8c42', '#b388ff', '#4cc9f0', '#90be6d', '#ffffff', '#ff7eb6', '#f9f871'];

const FLOORS = {
  standard: [[0,75],[32,100],[80,70],[128,100],[160,75]],
  deep:     [[0,40],[32,100],[80,72],[128,100],[160,40]],
  shallow:  [[0,88],[32,100],[80,86],[128,100],[160,88]],
  divider:  [[0,75],[32,100],[70,90],[77,48],[80,36],[83,48],[90,90],[128,100],[160,75]],
  shelves:  [[0,70],[14,80],[22,80],[32,100],[48,90],[56,90],[80,70],[104,90],[112,90],[128,100],[138,80],[146,80],[160,70]],
  pockets:  [[0,80],[22,100],[26,100],[32,97],[80,72],[128,97],[134,100],[138,100],[160,80]],
  lopsided: [[0,50],[32,100],[80,68],[128,100],[160,94]],
};
let FLOOR = [], FLOOR_PEAKS = [], NOZY = [BOT, BOT], VALLEY_X = [0, 0];
function setFloor(name){
  FLOOR = FLOORS[name].map(([x,y])=>[TANK.x + x/160*TANK.w, BOT - (100-y)*7.6]);
  // vertices that stick up (a ridge or peak) also push on rings
  FLOOR_PEAKS = FLOOR.filter((v,i)=>{
    if (i===0 || i===FLOOR.length-1) return false;
    const a = FLOOR[i-1], b = FLOOR[i+1];
    return v[1] < a[1] + (b[1]-a[1])*(v[0]-a[0])/(b[0]-a[0]) - 0.5;
  });
  NOZY = NOZ.map(x=>floorY(x));
  const mid = TANK.x + TANK.w/2;
  VALLEY_X = [0,1].map(side=>{
    const vs = FLOOR.filter(v=> side ? v[0] > mid : v[0] < mid);
    const lo = Math.max(...vs.map(v=>v[1])), at = vs.filter(v=>v[1] >= lo-1);
    return at.reduce((a,v)=>a+v[0],0)/at.length;
  });
}

// rings: r b y g = that colour, a = any colour. 'L:' = every ring starts in the left valley
const T = [.34,.62], S = [.48,.62], TALL = [.2,.52], OUT = [.3,.56];
const peg = (x, [tip, base], color=null, move=null)=>({ x, tip, base, color, move });
const mv = (amp, speed, phase=0)=>({ amp, speed, phase });
const R_ = 0, B_ = 1, Y_ = 2, G_ = 3;
const LEVELS = [
  { name: 'Warm Up',       par: 45,  floor: 'standard', rings: 'aaaaaa',           pegs: [peg(.36,T), peg(.64,T)] },
  { name: 'Three Peaks',   par: 75,  floor: 'standard', rings: 'aaaaaaaa',         pegs: [peg(.27,[.42,.68]), peg(.5,[.22,.5]), peg(.73,[.42,.68])] },
  { name: 'Drifter',       par: 55,  floor: 'standard', rings: 'aaaaa',            pegs: [peg(.5,[.28,.57],null,mv(.2,.6))] },
  { name: 'Colour Match',  par: 70,  floor: 'standard', rings: 'rbrbrb',           pegs: [peg(.33,T,R_), peg(.67,T,B_)] },
  { name: 'Crossover',     par: 80,  floor: 'standard', rings: 'rbrbrb',           pegs: [peg(.33,T,B_), peg(.67,T,R_)] },
  { name: 'Twin Drifters', par: 70,  floor: 'shallow',  rings: 'aaaaaa',           pegs: [peg(.36,T,null,mv(.12,.6)), peg(.64,T,null,mv(.12,.6,Math.PI))] },
  { name: 'Short Stuff',   par: 90,  floor: 'deep',     rings: 'aaaaaaaaaa',       pegs: [peg(.3,S), peg(.5,[.44,.58]), peg(.7,S)] },
  { name: 'Outfielders',   par: 70,  floor: 'standard', rings: 'aaaaaa',           pegs: [peg(.08,OUT), peg(.92,OUT)] },
  { name: 'Three Colours', par: 80,  floor: 'lopsided', rings: 'rbyrby',           pegs: [peg(.3,T,R_), peg(.5,TALL,Y_), peg(.7,T,B_)] },
  { name: 'Close Call',    par: 85,  floor: 'pockets',  rings: 'aaaaaa',           pegs: [peg(.27,[.4,.64]), peg(.73,[.4,.64])] },
  { name: 'Pendulum',      par: 100, floor: 'shallow',  rings: 'aaaaaaaa',         pegs: [peg(.28,T), peg(.5,[.26,.52],null,mv(.14,1.1)), peg(.72,T)] },
  { name: 'One Side',      par: 110, floor: 'divider',  rings: 'L:aaaaaaaa',       pegs: [peg(.6,T), peg(.76,[.4,.64])] },
  { name: 'Wide Spread',   par: 110, floor: 'standard', rings: 'rbaarbaarb',       pegs: [peg(.08,OUT,R_), peg(.38,T), peg(.62,T), peg(.92,OUT,B_)] },
  { name: 'Colour Swap',   par: 115, floor: 'shelves',  rings: 'brybrybry',        pegs: [peg(.3,T,Y_), peg(.5,TALL,R_), peg(.7,T,B_)] },
  { name: 'Skyline',       par: 100, floor: 'deep',     rings: 'aaaaaaaaaa',       pegs: [peg(.27,[.46,.68]), peg(.42,[.18,.5]), peg(.58,[.3,.58]), peg(.73,[.46,.68])] },
  { name: 'Hot Seat',      par: 110, floor: 'pockets',  rings: 'brbrbrbr',         pegs: [peg(.22,[.4,.62],R_), peg(.78,[.4,.62],B_)] },
  { name: 'Rush Hour',     par: 120, floor: 'shallow',  rings: 'aaaaaaaaa',        pegs: [peg(.3,T,null,mv(.06,.7)), peg(.5,[.26,.52],null,mv(.1,.9,2)), peg(.7,T,null,mv(.06,.7,4))] },
  { name: 'Four Colours',  par: 150, floor: 'lopsided', rings: 'rygbrygbrygb',     pegs: [peg(.26,T,R_), peg(.42,[.24,.52],Y_), peg(.58,[.24,.52],G_), peg(.74,T,B_)] },
  { name: 'Crowded Tank',  par: 170, floor: 'shelves',  rings: 'rbaraabrabarab',   pegs: [peg(.24,S,R_), peg(.4,[.44,.58]), peg(.6,[.44,.58]), peg(.76,S,B_)] },
  { name: 'Grand Finale',  par: 200, floor: 'divider',  rings: 'rygbrygbrygbrygb', pegs: [peg(.08,OUT,R_), peg(.36,[.26,.5],Y_,mv(.05,.8)), peg(.64,[.26,.5],G_,mv(.05,.8,Math.PI)), peg(.92,OUT,B_)] },
];
const RING_CODE = { a:null, r:R_, b:B_, y:Y_, g:G_ };

function floorY(x){
  for (let i=0;i<FLOOR.length-1;i++){
    const a=FLOOR[i], b=FLOOR[i+1];
    if (x<=b[0]) return a[1] + (b[1]-a[1]) * Math.max(0,(x-a[0])/(b[0]-a[0]));
  }
  return FLOOR[FLOOR.length-1][1];
}
function floorSlope(x){
  for (let i=0;i<FLOOR.length-1;i++){
    const a=FLOOR[i], b=FLOOR[i+1];
    if (x<=b[0]) return (b[1]-a[1])/(b[0]-a[0]);
  }
  return 0;
}

// ---------- Persistence ----------
let save = { unlocked: 1, best: {} };
try { const s = JSON.parse(localStorage.getItem('ringsplash') || 'null'); if (s) save = Object.assign(save, s); } catch(e){}
function persist(){ try { localStorage.setItem('ringsplash', JSON.stringify(save)); } catch(e){} }

// ---------- Canvas ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale=1, dpr=1, viewRot=0, VM = new DOMMatrix(), VMi = new DOMMatrix();
function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(innerWidth*dpr); cv.height = Math.round(innerHeight*dpr);
  updateView();
}
function updateView(){
  const ty = screen.orientation && screen.orientation.type;
  if (ty === 'landscape-primary' || ty === 'landscape-secondary') PRIMARY = findPrimary();
  viewRot = (((PRIMARY - screenAngle()) % 360) + 360) % 360;
  const swap = viewRot % 180 !== 0;
  const vw = swap ? innerHeight : innerWidth, vh = swap ? innerWidth : innerHeight;
  scale = Math.min(vw/W, vh/H);
  VM = new DOMMatrix().translate(innerWidth/2, innerHeight/2).rotate(viewRot).scale(scale).translate(-W/2, -H/2);
  VMi = VM.inverse();
}
addEventListener('resize', resize);

// ---------- State ----------
let state = 'title', lvlIdx = 0, pegs = [], rings = [], bubbles = [];
let t = 0, timer = 0, pumps = 0, settle = 0;
const jets = [0,1].map(()=>({ held:false, s:0, p:1 }));
let gx = 0, gy = G;
let tilt = 0, keyTilt = 0, tiltOn = true, tiltFlip = false, soundOn = true;
let rawAngle = 0, neutral = 0, haveMotion = false;
const keys = {};
try { const o = JSON.parse(localStorage.getItem('ringsplash_opts')||'null');
  if (o){ tiltOn=o.tiltOn!==false; tiltFlip=!!o.tiltFlip; soundOn=o.soundOn!==false; neutral=o.neutral||0; } } catch(e){}
function saveOpts(){ try{ localStorage.setItem('ringsplash_opts', JSON.stringify({tiltOn,tiltFlip,soundOn,neutral})); }catch(e){} }

function shade(hex, f){
  const n = parseInt(hex.slice(1),16);
  const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;
}

function loadLevel(i){
  lvlIdx = i; const L = LEVELS[i];
  setFloor(L.floor);
  pegs = L.pegs.map(p=>({ bx: TANK.x+p.x*TANK.w, x: TANK.x+p.x*TANK.w,
    tipY: TANK.y+p.tip*TANK.h, baseY: TANK.y+p.base*TANK.h,
    color: p.color, move: p.move }));
  for (const p of pegs) if (p.move) p.x = p.bx + p.move.amp*TANK.w*Math.sin(p.move.phase);
  let codes = L.rings, leftOnly = false;
  if (codes.startsWith('L:')){ leftOnly = true; codes = codes.slice(2); }
  const coloured = /[rbyg]/.test(codes), neutral = coloured ? NEUTRAL_IN_COLOUR : RCOL;
  let n = 0; const perSide = [0,0];
  rings = [...codes].map((c,k)=>{
    const m = RING_CODE[c], col = m==null ? neutral[(n++)%neutral.length] : PEGCOL[m];
    const side = leftOnly ? 0 : k%2, layer = perSide[side]++;
    const x = VALLEY_X[side] + ((layer%3)-1)*70 + (Math.random()-.5)*20;
    const ground = Math.min(floorY(x-40), floorY(x), floorY(x+40));
    return { x, y: ground - TH - 30 - Math.floor(layer/3)*40,
      vx:0, vy:0, py:0, phi:(Math.random()-.5)*.4, vphi:0, rot:0, w:0, touching:0,
      match:m, col, dark:shade(col,.62), peg:null, seed:Math.random()*100 };
  });
  t=0; timer=0; pumps=0; settle=0; bubbles=[];
  jets.forEach(j=>{ j.s=0; j.p=1; });
}

// ---------- Input ----------
const pointers = new Map();
function updateHeld(){
  const h=[false,false];
  for (const s of pointers.values()) h[s]=true;
  if (keys.a||keys.z) h[0]=true;
  if (keys.l||keys.m) h[1]=true;
  jets.forEach((j,k)=>{
    if (h[k] && !j.held && state==='play'){ pumps++; }
    j.held = h[k];
  });
}
cv.addEventListener('pointerdown', e=>{
  e.preventDefault(); ensureAudio();
  if (state!=='play') return;
  const gp = VMi.transformPoint(new DOMPoint(e.clientX, e.clientY));
  pointers.set(e.pointerId, gp.x < W/2 ? 0 : 1);
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  updateHeld();
});
const lift = e=>{ pointers.delete(e.pointerId); updateHeld(); };
cv.addEventListener('pointerup', lift);
cv.addEventListener('pointercancel', lift);
cv.addEventListener('contextmenu', e=>e.preventDefault());
addEventListener('keydown', e=>{
  const k = e.key.length===1 ? e.key.toLowerCase() : e.key;
  keys[k]=true; updateHeld();
  if (k==='Escape' || k==='p'){ if (state==='play') openMenu(); else if (state==='paused') closeMenu(); }
});
addEventListener('keyup', e=>{ const k = e.key.length===1 ? e.key.toLowerCase() : e.key; keys[k]=false; updateHeld(); });

function wrapA(a){ return a - 2*Math.PI*Math.round(a/(2*Math.PI)); }
function screenAngle(){
  const a = (screen.orientation && typeof screen.orientation.angle==='number') ? screen.orientation.angle : (window.orientation||0);
  return ((a%360)+360)%360;
}
// The game is glued to the device in its landscape-primary pose. Phones are
// naturally portrait (landscape-primary = 90 deg); tablets/desktops are 0.
function findPrimary(){
  const a = screenAngle(), ty = screen.orientation && screen.orientation.type;
  if (ty === 'landscape-primary') return a;
  if (ty === 'landscape-secondary') return (a+180)%360;
  const wide = innerWidth > innerHeight;
  const naturalPortrait = (a%180===0) ? !wide : wide;
  return naturalPortrait ? 90 : 0;
}
let PRIMARY = findPrimary();
let motionN = 0, orientN = 0, nativeN = 0, lastMotionT = 0, sensorSrc = 'none';
function onMotion(e){
  const a = e.accelerationIncludingGravity;
  if (!a || a.x==null) return;
  motionN++; lastMotionT = performance.now(); sensorSrc = 'motion';
  feedGravity(a.x, a.y);
}
// Fallback: derive gravity from orientation angles when devicemotion is silent
function onOrient(e){
  if (e.beta==null || e.gamma==null) return;
  orientN++;
  if (performance.now() - lastMotionT < 500) return;
  sensorSrc = 'orientation';
  const b = e.beta*Math.PI/180, g = e.gamma*Math.PI/180;
  feedGravity(-Math.cos(b)*Math.sin(g)*9.8, Math.sin(b)*9.8);
}
// Native bridge: an Android app can call window.ringSplashGravity(x, y)
// with SensorManager accelerometer values (device coords, m/s²).
window.ringSplashGravity = (x, y)=>{ nativeN++; lastMotionT = performance.now(); sensorSrc = 'native'; feedGravity(x, y); };
function feedGravity(ax, ay){
  const a = { x: ax, y: ay };
  const th = PRIMARY*Math.PI/180;
  const sx = a.x*Math.cos(th) - a.y*Math.sin(th);
  const su = a.x*Math.sin(th) + a.y*Math.cos(th);
  const sgx = -sx, sgy = su;
  if (Math.hypot(sgx,sgy) < 1.2) return;   // phone lying flat: keep last angle
  const ang = Math.atan2(sgx, sgy);
  rawAngle = wrapA(rawAngle + wrapA(ang - rawAngle) * 0.3);
  haveMotion = true;
}
addEventListener('devicemotion', onMotion);
resize();
if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', resize);
addEventListener('orientationchange', resize);
addEventListener('deviceorientation', onOrient);

async function startMotion(){
  try {
    if (typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function')
      await DeviceMotionEvent.requestPermission();
  } catch(e){}
}
async function goFullscreen(){
  try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen({navigationUI:'hide'}); } catch(e){}
  try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape-primary'); } catch(e){}
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch(e){}
}

// ---------- Audio ----------
let AC=null, master=null; const jetNodes=[];
function ensureAudio(){
  if (AC){ if (AC.state==='suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = soundOn?0.8:0; master.connect(AC.destination);
    const len = AC.sampleRate*2, buf = AC.createBuffer(1,len,AC.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i]=Math.random()*2-1;
    for (let k=0;k<2;k++){
      const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
      const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=500; bp.Q.value=2.5;
      const g=AC.createGain(); g.gain.value=0;
      let out=g;
      if (AC.createStereoPanner){ const p=AC.createStereoPanner(); p.pan.value=k?0.6:-0.6; g.connect(p); out=p; }
      src.connect(bp); bp.connect(g); out.connect(master); src.start();
      jetNodes.push({g,bp});
    }
  } catch(e){ AC=null; }
}
function plink(freq, when=0, vol=0.25){
  if (!AC || !soundOn) return;
  const t0 = AC.currentTime + when;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(freq,t0); o.frequency.exponentialRampToValueAtTime(freq*1.6,t0+0.12);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.35);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+0.4);
}
function updateAudio(){
  if (!AC) return;
  const now = AC.currentTime;
  jetNodes.forEach((n,k)=>{
    const s = state==='play' ? jets[k].s : 0;
    n.g.gain.setTargetAtTime(s*0.5, now, 0.03);
    n.bp.frequency.setTargetAtTime(300 + Math.random()*900*(0.4+s), now, 0.015);
  });
}

// ---------- Simulation ----------
function threadFeedback(){
  plink(700 + Math.random()*500);
  try{ navigator.vibrate && navigator.vibrate(18); }catch(e){}
}

// ---------- Rigid-body ring physics ----------
// Each ring is a capsule in the game plane: a core segment along its own axis
// with rounded ends of radius h. h is the ring's thickness seen side-on: thin
// when it lies flat, a full circle when it faces you. Rings have mass, spin and
// a centre of gravity; every contact point pushes and grips at its own spot, so
// rings topple, pivot on peg tips and lever each other naturally.
const I_RING = 1.0*R*R;          // rotational inertia, including the water it drags along
const INV_I = 1/I_RING;
              const SLOP = 0.4;
let contacts = [];

function shape(r){
  const h = TH + (R-TH)*Math.abs(Math.sin(r.phi));
  const a = Math.max(0, R-h), c = Math.cos(r.rot)*a, s = Math.sin(r.rot)*a;
  return { h, x0:r.x-c, y0:r.y-s, x1:r.x+c, y1:r.y+s };
}
function closestOnSeg(px,py,x0,y0,x1,y1){
  const dx=x1-x0, dy=y1-y0, L2=dx*dx+dy*dy;
  const u = L2>1e-9 ? Math.max(0,Math.min(1,((px-x0)*dx+(py-y0)*dy)/L2)) : 0;
  return [x0+dx*u, y0+dy*u, u];
}
function clamp01(v){ return v<0?0:v>1?1:v; }
// closest points between segments a0-a1 and b0-b1
function segSeg(a0x,a0y,a1x,a1y,b0x,b0y,b1x,b1y){
  const d1x=a1x-a0x, d1y=a1y-a0y, d2x=b1x-b0x, d2y=b1y-b0y, rx=a0x-b0x, ry=a0y-b0y;
  const a=d1x*d1x+d1y*d1y, e=d2x*d2x+d2y*d2y, f=d2x*rx+d2y*ry;
  let s, u;
  if (a<=1e-9 && e<=1e-9){ s=0; u=0; }
  else if (a<=1e-9){ s=0; u=clamp01(f/e); }
  else {
    const c=d1x*rx+d1y*ry;
    if (e<=1e-9){ u=0; s=clamp01(-c/a); }
    else {
      const b=d1x*d2x+d1y*d2y, den=a*e-b*b;
      s = den>1e-9 ? clamp01((b*f-c*e)/den) : 0;
      u = (b*s+f)/e;
      if (u<0){ u=0; s=clamp01(-c/a); } else if (u>1){ u=1; s=clamp01((b-c)/a); }
    }
  }
  return [a0x+d1x*s, a0y+d1y*s, b0x+d2x*u, b0y+d2y*u];
}
// grip of a ring: lying flat it has full contact and grips hard; on its edge it slips
function gripOf(r){ return 0.3 + 0.6*(1 - Math.abs(Math.sin(r.phi))); }
// n points from b (or the static surface) into ring a
function addContact(a, b, px, py, nx, ny, pen, mu, bvx, bvy){
  if (pen < -3) return;
  contacts.push({ a, b, px, py, nx, ny, pen, mu, bvx: bvx||0, bvy: bvy||0, jn:0, jt:0 });
}
function bobGap(r){ return 3 + 3*Math.sin(t*1.4 + r.seed); }   // threaded rings float on a cushion of water

function ringVsStatic(r, S){
  const mu = gripOf(r), ends = [[S.x0,S.y0],[S.x1,S.y1]];
  for (const [ex,ey] of ends){
    addContact(r, null, TANK.x, ey, 1, 0, S.h - (ex - TANK.x), mu);
    addContact(r, null, TANK.x+TANK.w, ey, -1, 0, S.h - (TANK.x+TANK.w - ex), mu);
    addContact(r, null, ex, TANK.y, 0, 1, S.h - (ey - TANK.y), mu);
    for (let i=0;i<FLOOR.length-1;i++){
      const A = FLOOR[i], B = FLOOR[i+1];
      const [qx,qy,u] = closestOnSeg(ex,ey,A[0],A[1],B[0],B[1]);
      const L = Math.hypot(B[0]-A[0], B[1]-A[1]), lnx = (B[1]-A[1])/L, lny = -(B[0]-A[0])/L;
      let nx = ex-qx, ny = ey-qy, dist;
      if (u>0 && u<1){ dist = nx*lnx + ny*lny; nx = lnx; ny = lny; if (dist < -S.h - 40) continue; }   // far behind this face = the other side of a ridge, not under it
      else { dist = Math.hypot(nx,ny); if (dist<0.01) continue; nx/=dist; ny/=dist; if (nx*lnx+ny*lny < 0) continue; }
      addContact(r, null, qx, qy, nx, ny, S.h - dist, mu);
    }
  }
  // the hump's peak poking into the middle of a ring
  for (const V of FLOOR_PEAKS){
    const [qx,qy] = closestOnSeg(V[0],V[1],S.x0,S.y0,S.x1,S.y1);
    const d = Math.hypot(qx-V[0], qy-V[1]);
    if (d > 0.01 && qy < V[1]) addContact(r, null, V[0], V[1], (qx-V[0])/d, (qy-V[1])/d, S.h - d, mu);
  }
}

// The ring's hole: how far its inner edge reaches from the centre along the
// ring's axis. Lying flat that's the whole hole. As the ring tumbles toward
// facing you, a vertical peg must cross its plane ever more steeply, so the
// opening it can pass through shrinks, closing at about 75 degrees.
function holeHalf(r){ return HOLE*Math.min(1, Math.abs(Math.cos(r.phi))*1.3); }
// Seen edge-on a ring is two pieces of rim with the hole between them: a
// capsule across the ring on each side of the hole.
function rims(r, S){
  const gi = holeHalf(r), rr = (R - gi)/2, m = (R + gi)/2, hv = Math.max(0, S.h - rr);
  const ux = Math.cos(r.rot), uy = Math.sin(r.rot), vx = -uy, vy = ux;
  return [-1,1].map(sg=>{
    const cx = r.x + sg*m*ux, cy = r.y + sg*m*uy;
    return { rr, cx, cy, x0: cx - vx*hv, y0: cy - vy*hv, x1: cx + vx*hv, y1: cy + vy*hv };
  });
}
// Does a peg pass through this ring's hole right now? Pure observation of the
// geometry, used for scoring, drawing and sound; it never moves anything.
function threadedOn(r){
  const ux = Math.cos(r.rot), uy = Math.sin(r.rot);
  if (Math.abs(ux) < 0.2) return null;
  const gi = holeHalf(r);
  for (const p of pegs){
    const sa = (p.x - r.x)/ux, cy = r.y + sa*uy;          // where the peg crosses the ring's axis
    if (Math.abs(sa) < gi && cy > p.tipY && cy < p.baseY + 40){ r.pegS = sa; return p; }
  }
  return null;
}

function ringVsPegs(r, S){
  const RM = rims(r, S);
  for (const p of pegs){
    // pedestal dome: also what a stack on the peg rests on
    const pcx = p.x, pcy = p.baseY + 30, pr = 32;
    {
      const [qx,qy] = closestOnSeg(pcx,pcy,S.x0,S.y0,S.x1,S.y1);
      const d = Math.hypot(qx-pcx, qy-pcy) || 0.01, nx = (qx-pcx)/d, ny = (qy-pcy)/d;
      const pen = S.h + pr - d - (r.peg===p ? bobGap(r) : 0);
      addContact(r, null, pcx+nx*pr, pcy+ny*pr, nx, ny, pen, 0.12, p.vx, 0);   // round, smooth dome
    }
    // the peg against each piece of rim: inside the hole it touches neither
    for (const q of RM){
      const [c1x,c1y,c2x,c2y] = segSeg(q.x0,q.y0,q.x1,q.y1, p.x,p.tipY, p.x,p.baseY);
      let nx = c1x-c2x, ny = c1y-c2y, d = Math.hypot(nx,ny);
      if (d < 0.01){ nx = Math.sign(q.cx - p.x) || 1; ny = 0; } else { nx /= d; ny /= d; }
      addContact(r, null, c2x+nx*PEGW, c2y+ny*PEGW, nx, ny, q.rr + PEGW - d, 0.05, p.vx, 0);   // polished peg
    }
  }
}

function ringVsRing(A, SA, B, SB){
  const mu = (A.peg && A.peg===B.peg) ? 0.08 : Math.sqrt(gripOf(A)*gripOf(B));   // a stack floats freely
  const gap = (A.peg && A.peg===B.peg) ? bobGap(A.y < B.y ? A : B) : 0;
  let found = false;
  const test = (P, SP, Q, SQ)=>{
    for (const [ex,ey] of [[SP.x0,SP.y0],[SP.x1,SP.y1]]){
      const [qx,qy] = closestOnSeg(ex,ey,SQ.x0,SQ.y0,SQ.x1,SQ.y1);
      const d = Math.hypot(ex-qx, ey-qy); if (d < 0.01) continue;
      const nx = (ex-qx)/d, ny = (ey-qy)/d, pen = SP.h + SQ.h - d - gap;
      if (pen > -3){ addContact(P, Q, qx+nx*SQ.h, qy+ny*SQ.h, nx, ny, pen, mu); found = true; }
    }
  };
  test(A,SA,B,SB); test(B,SB,A,SA);
  if (!found){   // crossing in an X: cores closest somewhere in the middle
    const [c1x,c1y,c2x,c2y] = segSeg(SA.x0,SA.y0,SA.x1,SA.y1,SB.x0,SB.y0,SB.x1,SB.y1);
    const d = Math.hypot(c1x-c2x, c1y-c2y);
    if (d > 0.01) addContact(A, B, c2x+(c1x-c2x)/d*SB.h, c2y+(c1y-c2y)/d*SB.h, (c1x-c2x)/d, (c1y-c2y)/d, SA.h+SB.h-d-gap, mu);
  }
}

function applyImpulse(r, rx, ry, jx, jy, sign){
  r.vx += sign*jx; r.vy += sign*jy;
  r.w += sign*INV_I*(rx*jy - ry*jx);
}
function solveContacts(dt, iters){
  for (const c of contacts){
    const a = c.a, b = c.b;
    c.rax = c.px - a.x; c.ray = c.py - a.y;
    const tx = -c.ny, ty = c.nx; c.tx = tx; c.ty = ty;
    let kn = 1 + INV_I*Math.pow(c.rax*c.ny - c.ray*c.nx, 2);
    let kt = 1 + INV_I*Math.pow(c.rax*ty - c.ray*tx, 2);
    if (b){ c.rbx = c.px - b.x; c.rby = c.py - b.y;
      kn += 1 + INV_I*Math.pow(c.rbx*c.ny - c.rby*c.nx, 2);
      kt += 1 + INV_I*Math.pow(c.rbx*ty - c.rby*tx, 2); }
    c.kn = kn; c.kt = kt;
    c.vtarget = c.pen < 0 ? c.pen/dt : 0;      // a gap may close, but no further
  }
  for (let it=0; it<iters; it++){
    for (const c of contacts){
      const a = c.a, b = c.b;
      const rel = ()=>{
        let vx = a.vx - a.w*c.ray, vy = a.vy + a.w*c.rax;
        if (b){ vx -= b.vx - b.w*c.rby; vy -= b.vy + b.w*c.rbx; } else { vx -= c.bvx; vy -= c.bvy; }
        return [vx, vy];
      };
      let [vx,vy] = rel();
      const vn = vx*c.nx + vy*c.ny;
      let dj = (c.vtarget - vn)/c.kn;
      const jn = Math.max(0, c.jn + dj); dj = jn - c.jn; c.jn = jn;
      if (dj){ applyImpulse(a, c.rax, c.ray, dj*c.nx, dj*c.ny, 1); if (b) applyImpulse(b, c.rbx, c.rby, dj*c.nx, dj*c.ny, -1); }
      [vx,vy] = rel();
      const vt = vx*c.tx + vy*c.ty, mx = c.mu*c.jn;
      let dt2 = -vt/c.kt;
      const jt = Math.max(-mx, Math.min(mx, c.jt + dt2)); dt2 = jt - c.jt; c.jt = jt;
      if (dt2){ applyImpulse(a, c.rax, c.ray, dt2*c.tx, dt2*c.ty, 1); if (b) applyImpulse(b, c.rbx, c.rby, dt2*c.tx, dt2*c.ty, -1); }
    }
  }
}

function stepRings(dt){
  for (const p of pegs){ p.vx = (p.x - (p.px==null ? p.x : p.px))/dt; p.px = p.x; }

  // forces: gravity, water currents, jets, drag
  for (const r of rings){
    r.py = r.y;
    let ax = gx + 55*Math.sin(t*0.9 + r.seed) + 35*Math.sin(t*2.3 + r.seed*1.7);
    let ay = gy + 45*Math.sin(t*1.3 + r.seed*2.1);
    r.w += Math.sin(t*1.1 + r.seed*1.3)*0.3*dt;
    r.vphi += Math.sin(t*1.7 + r.seed*3)*0.8*dt;
    for (let k=0;k<2;k++){
      const j = jets[k]; if (j.s < 0.01) continue;
      const dy = NOZY[k] - r.y; if (dy < 0) continue;
      const w = JET_W0 + dy*JET_SPREAD, dx = r.x - NOZ[k];
      const inf = Math.exp(-(dx*dx)/(w*w)) * Math.exp(-dy/JET_REACH);
      const f = j.s*inf*JET;
      ay -= f;
      ax += (dx/w)*f*0.3 + Math.sin(t*3.1 + r.seed)*f*0.15;
      r.w += ((dx/w)*3 + (Math.random()-0.5)*20) * j.s*inf*dt;   // the jet hits one side harder
      r.vphi += (Math.random()-0.5)*j.s*inf*160*dt;
    }
    r.vx += ax*dt; r.vy += ay*dt;
    const d = Math.exp(-DRAG*dt); r.vx *= d; r.vy *= d;
    // sinking through water, a ring drifts toward falling broadside
    const sp = Math.hypot(r.vx, r.vy);
    r.w += -Math.sin(2*(r.rot + tilt))*sp*0.012*dt;
    // A real ring is round: standing up on its rim (axis along gravity), its
    // centre of gravity is never quite over the contact, so it leans over
    // toward lying down. Stronger while it rests on something.
    {
      let rel = r.rot + tilt; rel -= Math.PI*Math.round(rel/Math.PI);       // 0 = lying across gravity
      const up = Math.abs(rel);                                              // pi/2 = standing up
      if (up > 0.6){
        const dir = Math.sign(rel) || (r.seed > 50 ? 1 : -1);
        r.w += -dir*(r.touching ? 7 : 1.5)*Math.sin(up)*dt;
      }
    }
    r.w *= Math.exp(-2.5*dt);
  }

  for (const r of rings) r.peg = threadedOn(r);

  // contacts
  contacts = [];
  const shapes = rings.map(shape);
  rings.forEach((r,i)=>{ ringVsStatic(r, shapes[i]); ringVsPegs(r, shapes[i]); });
  for (let i=0;i<rings.length;i++) for (let k=i+1;k<rings.length;k++){
    const A = rings[i], B = rings[k];
    if (Math.abs(A.x-B.x) > 2*R+10 || Math.abs(A.y-B.y) > 2*R+10) continue;
    ringVsRing(A, shapes[i], B, shapes[k]);
  }
  solveContacts(dt, 10);

  // move
  for (const r of rings){ r.x += r.vx*dt; r.y += r.vy*dt; r.rot += r.w*dt; r.touching = 0; }

  // push apart anything still overlapping (position only, adds no bounce)
  for (const c of contacts){
    if (c.jn > 0) c.a.touching++;
    if (c.pen <= SLOP) continue;
    const corr = (c.pen - SLOP)*0.45, share = c.b ? 0.5 : 1;
    c.a.x += c.nx*corr*share; c.a.y += c.ny*corr*share;
    if (c.b){ c.b.x -= c.nx*corr*share; c.b.y -= c.ny*corr*share; }
  }

  for (const r of rings){
    // front-to-back tumble: lying flat is stable, standing face-on topples,
    // and much faster when it's resting on something
    const k = r.touching ? 16 : 5;
    r.vphi += -Math.sin(2*r.phi)*k*dt; r.vphi *= Math.exp(-2.5*dt); r.phi += r.vphi*dt;

    // a peg through the hole physically stops the ring tumbling past it:
    // the opening can't close tighter than the peg
    const was = r.peg;
    r.peg = threadedOn(r);
    if (r.peg){
      const need = Math.min(1, (Math.abs(r.pegS) + PEGW + 1)/(1.3*HOLE));
      const base = Math.round(r.phi/Math.PI)*Math.PI, dev = r.phi - base;
      if (Math.abs(Math.cos(r.phi)) < need){
        r.phi = base + Math.sign(dev)*Math.acos(need);
        if (Math.sign(r.vphi) === Math.sign(dev)) r.vphi = 0;
      }
      if (!was && t - (r.fbT||-9) > 0.6){ r.fbT = t; threadFeedback(); }
    }
  }
}

function step(dt){
  t += dt; timer += dt;
  for (const p of pegs) if (p.move) p.x = p.bx + p.move.amp*TANK.w*Math.sin(t*p.move.speed + p.move.phase);

  // tilt: full 360 deg. Gravity always points at the real ground.
  const kb = keys.ArrowLeft || keys.ArrowRight;
  if (keys.ArrowLeft) keyTilt -= dt*2.2; else if (keys.ArrowRight) keyTilt += dt*2.2;
  else keyTilt -= wrapA(keyTilt)*Math.min(1, dt*2.5);
  keyTilt = wrapA(keyTilt);
  const target = (tiltOn && haveMotion && !kb) ? wrapA((rawAngle-neutral)*(tiltFlip?-1:1)) : keyTilt;
  tilt = wrapA(tilt + wrapA(target - tilt)*Math.min(1, dt*12));
  gx = Math.sin(tilt)*G; gy = Math.cos(tilt)*G;

  // pumps work like the toy's bellows: a press squeezes out one limited
  // burst (shorter if you let go early); holding adds nothing once it's
  // empty, and it only refills while the button is up
  for (const j of jets){
    const pushing = j.held && j.p > 0;
    j.s += ((pushing ? 1 : 0) - j.s) * Math.min(1, dt*(pushing ? 28 : 14));
    if (pushing) j.p = Math.max(0, j.p - dt/BURST);
    else if (!j.held) j.p = Math.min(1, j.p + dt/REFILL);
  }

  stepRings(dt);

  // bubbles
  for (let k=0;k<2;k++){
    const s = jets[k].s;
    if (Math.random() < s*dt*110) bubbles.push({ x:NOZ[k]+(Math.random()-.5)*24, y:NOZY[k]-14, r:3+Math.random()*9*s,
      vx:(Math.random()-.5)*120, vy:-350-Math.random()*350*s, ph:Math.random()*6 });
  }
  if (Math.random() < dt*1.5){ const x = TANK.x+40+Math.random()*(TANK.w-80); bubbles.push({x, y:floorY(x)-4, r:2+Math.random()*3, vx:0, vy:-60, ph:Math.random()*6}); }
  for (const b of bubbles){
    b.vy += (-130 - b.vy)*Math.min(1,dt*1.8); b.vx *= Math.exp(-2*dt);
    b.x += (b.vx + Math.sin(t*6+b.ph)*30)*dt; b.y += b.vy*dt;
  }
  bubbles = bubbles.filter(b=>b.y > TANK.y + 10);
  if (bubbles.length > 400) bubbles.splice(0, bubbles.length-400);

  // win check
  const allIn = rings.every(r=>scores(r) && Math.abs(r.vy) < 40);
  settle = allIn ? settle + dt : 0;
  if (settle > 0.8) winLevel();
}

function scores(r){ return !!r.peg && (r.peg.color==null || r.peg.color===r.match) && r.y > r.peg.tipY + TH; }
function landedCount(){ return rings.filter(scores).length; }

// ---------- Drawing ----------
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h); }

function annulus(cx,cy,rx,ry,k){
  ctx.beginPath();
  ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
  ctx.moveTo(cx+rx*k,cy);
  ctx.ellipse(cx,cy,rx*k,ry*k,0,0,Math.PI*2,true);
  ctx.fill('evenodd');
}
function drawRing(r, part){
  const fs = Math.abs(Math.sin(r.phi));
  const ry = R*(0.3 + 0.7*fs), band = 7*(1-fs) + 2;
  ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot);
  if (part){ ctx.beginPath(); if (part<0) ctx.rect(-R-12,-R-24,2*R+24,R+24); else ctx.rect(-R-12,0,2*R+24,R+30); ctx.clip(); }
  ctx.fillStyle = r.dark; annulus(0, band, R, ry, HOLE/R);
  ctx.fillStyle = r.col;  annulus(0, 0, R, ry, HOLE/R);
  if (r.peg && r.peg.color!=null && r.peg.color!==r.match){   // wrong peg: pulse red
    ctx.strokeStyle = `rgba(255,40,60,${0.5+0.5*Math.sin(t*8)})`; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.ellipse(0, 0, R+3, ry+3, 0, 0, Math.PI*2); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.ellipse(0, 0, R-8, Math.max(2, ry-ry*0.17), 0, Math.PI*1.08, Math.PI*1.62); ctx.stroke();
  ctx.restore();
}
function drawPeg(p){
  // mount plate on back wall + rail
  if (p.move){
    ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=8; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(p.bx-p.move.amp*TANK.w, p.baseY+30); ctx.lineTo(p.bx+p.move.amp*TANK.w, p.baseY+30); ctx.stroke();
  }
  const grd = ctx.createLinearGradient(p.x-PEGW,0,p.x+PEGW,0);
  grd.addColorStop(0,'#cfd8e6'); grd.addColorStop(.45,'#ffffff'); grd.addColorStop(1,'#9aa7bb');
  ctx.fillStyle = grd;
  ctx.fillRect(p.x-PEGW, p.tipY, PEGW*2, p.baseY - p.tipY + 10);
  ctx.beginPath(); ctx.arc(p.x, p.tipY, PEGW, Math.PI, 0); ctx.fill();
  if (p.color!=null){
    ctx.fillStyle = PEGCOL[p.color];
    ctx.beginPath(); ctx.arc(p.x, p.tipY, PEGW+3, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(p.x-PEGW, p.tipY+14, PEGW*2, 10);
  }
}
function drawPedestal(p){
  const cx=p.x, cy=p.baseY+30;
  const g = ctx.createRadialGradient(cx-10,cy-14,4,cx,cy,40);
  const base = p.color!=null ? PEGCOL[p.color] : '#ffd23f';
  g.addColorStop(0,'#ffffff'); g.addColorStop(.35, base); g.addColorStop(1, shade(base,.55));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(cx, cy, 36, 30, 0, 0, Math.PI*2); ctx.fill();
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#2a0f1c'; ctx.fillRect(0,0,cv.width,cv.height);
  if ((((PRIMARY - screenAngle()) % 360) + 360) % 360 !== viewRot) updateView();
  ctx.setTransform(dpr*VM.a, dpr*VM.b, dpr*VM.c, dpr*VM.d, dpr*VM.e, dpr*VM.f);

  // casing
  const cg = ctx.createLinearGradient(0,0,0,H);
  cg.addColorStop(0,'#f2566a'); cg.addColorStop(1,'#b8283a');
  ctx.fillStyle = cg; rr(0,0,W,H,70); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=4; rr(8,8,W-16,H-16,62); ctx.stroke();

  // tank water
  ctx.save(); rr(TANK.x,TANK.y,TANK.w,TANK.h,34); ctx.clip();
  const wg = ctx.createLinearGradient(0,TANK.y,0,BOT);
  wg.addColorStop(0,'#7fe3ff'); wg.addColorStop(.55,'#29a6e0'); wg.addColorStop(1,'#1665b8');
  ctx.fillStyle = wg; ctx.fillRect(TANK.x,TANK.y,TANK.w,TANK.h);
  // light rays
  ctx.fillStyle='rgba(255,255,255,.07)';
  for (let i=0;i<5;i++){
    const x0 = TANK.x + 120 + i*270 + Math.sin(t*0.4+i)*40;
    ctx.beginPath(); ctx.moveTo(x0,TANK.y); ctx.lineTo(x0+70,TANK.y); ctx.lineTo(x0+220+Math.sin(t*.3+i)*60,BOT); ctx.lineTo(x0+60,BOT); ctx.fill();
  }
  // floor
  ctx.fillStyle='#ffe3a3';
  ctx.beginPath(); ctx.moveTo(TANK.x,BOT+40); FLOOR.forEach(([x,y])=>ctx.lineTo(x,y)); ctx.lineTo(TANK.x+TANK.w,BOT+40); ctx.fill();
  ctx.strokeStyle='#f0b85c'; ctx.lineWidth=5; ctx.beginPath(); FLOOR.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.stroke();
  // nozzles
  for (let k=0;k<2;k++){
    const x = NOZ[k], NY = NOZY[k], on = jets[k].s;   // glow: narrow core fading upward
    ctx.fillStyle = '#4a5568';
    ctx.beginPath(); ctx.moveTo(x-30,NY+20); ctx.lineTo(x-12,NY-16); ctx.lineTo(x+12,NY-16); ctx.lineTo(x+30,NY+20); ctx.fill();
    if (on>0.02){
      const jg = ctx.createLinearGradient(0,NY-16,0,NY-460);
      jg.addColorStop(0,`rgba(255,255,255,${0.45*on})`); jg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle = jg;
      ctx.beginPath(); ctx.moveTo(x-12,NY-16); ctx.lineTo(x+12,NY-16); ctx.lineTo(x+75,NY-420); ctx.lineTo(x-75,NY-420); ctx.fill();
    }
  }
  pegs.forEach(drawPedestal);
  const caught = rings.filter(r=>r.peg);
  caught.forEach(r=>drawRing(r,-1));
  pegs.forEach(drawPeg);
  caught.forEach(r=>drawRing(r,1));
  rings.filter(r=>!r.peg).forEach(r=>drawRing(r,0));
  // bubbles
  ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=2;
  for (const b of bubbles){ ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.stroke(); }
  // glass glare
  const gg = ctx.createLinearGradient(TANK.x,TANK.y,TANK.x+500,TANK.y+500);
  gg.addColorStop(0,'rgba(255,255,255,.22)'); gg.addColorStop(.35,'rgba(255,255,255,0)');
  ctx.fillStyle = gg; ctx.fillRect(TANK.x,TANK.y,TANK.w,TANK.h);
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=6; rr(TANK.x,TANK.y,TANK.w,TANK.h,34); ctx.stroke();

  // HUD on casing
  ctx.fillStyle='#fff'; ctx.font='800 34px system-ui,sans-serif'; ctx.textBaseline='middle';
  ctx.textAlign='left';
  if (state!=='title') ctx.fillText(`${lvlIdx+1}. ${LEVELS[lvlIdx].name}`, TANK.x+10, 44);
  else ctx.fillText('RING SPLASH', TANK.x+10, 44);
  ctx.textAlign='right';
  if (state!=='title'){
    const s = Math.floor(timer);
    ctx.fillText(`◯ ${landedCount()}/${rings.length}   ⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`, TANK.x+TANK.w-10, 44);
  }

  // pump buttons + pressure gauges
  for (let k=0;k<2;k++){
    const cx = k? W-85 : 85, j = jets[k], pressed = j.held;
    // gauge
    ctx.fillStyle='rgba(0,0,0,.25)'; rr(cx-16,200,32,380,16); ctx.fill();
    const ph = 372*j.p;
    ctx.fillStyle = j.p < 0.05 ? '#ffb3b3' : (j.p>0.3 ? '#7fe3ff' : '#ffd23f');
    rr(cx-12,576-ph,24,ph,12); ctx.fill();
    // button
    ctx.fillStyle='#7a1424'; ctx.beginPath(); ctx.arc(cx,700+8,60,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = pressed ? '#ffc61a' : '#ffd23f';
    ctx.beginPath(); ctx.arc(cx, pressed?706:696, 58, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#b86e00'; ctx.font='800 22px system-ui,sans-serif'; ctx.textAlign='center';
    ctx.fillText('PUMP', cx, pressed?706:696);
  }

  // build number, bottom-left of the case
  ctx.fillStyle='rgba(255,255,255,.75)'; ctx.font='700 20px system-ui,sans-serif'; ctx.textAlign='left';
  ctx.fillText(VERSION, TANK.x+6, BOT+23);

  // spirit level (tilt indicator) in bottom strip
  const lx=W/2, ly=BOT+23;
  ctx.fillStyle='rgba(0,0,0,.25)'; rr(lx-110,ly-13,220,26,13); ctx.fill();
  ctx.fillStyle='#d8ff7a'; rr(lx-106,ly-9,212,18,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.ellipse(lx - Math.max(-1, Math.min(1, tilt/1.2))*88, ly, 16, 7, 0, 0, Math.PI*2); ctx.fill();
  if (!haveMotion && tiltOn){
    ctx.fillStyle='rgba(255,255,255,.8)'; ctx.font='700 18px system-ui,sans-serif'; ctx.textAlign='left';
    ctx.fillText('no tilt sensor', lx+124, ly);
  }
  ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(lx-20,ly-9); ctx.lineTo(lx-20,ly+9); ctx.moveTo(lx+20,ly-9); ctx.lineTo(lx+20,ly+9); ctx.stroke();
}

// ---------- Loop ----------
let last = performance.now(), acc = 0;
const DT = 1/120;
function frame(now){
  let el = (now - last)/1000; last = now;
  if (el > 0.1) el = 0.1;
  if (state==='play'){
    acc += el;
    while (acc >= DT){ step(DT); acc -= DT; }
  } else if (state==='title'){
    // idle demo: bubbles drift on title screen
    t += el;
  }
  updateAudio();
  draw();
  requestAnimationFrame(frame);
}

// ---------- UI ----------
const $ = id=>document.getElementById(id);
function show(id, on){ $(id).classList.toggle('hidden', !on); }
function starsFor(i, time){ const p = LEVELS[i].par; return time<=p ? 3 : time<=p*1.6 ? 2 : 1; }

function buildLevels(){
  const box = $('levels'); box.innerHTML='';
  LEVELS.forEach((L,i)=>{
    const b = document.createElement('button');
    const st = save.best[i]||0;
    b.innerHTML = `${i+1}<small>${'★'.repeat(st)}</small>`;
    b.disabled = i >= save.unlocked;
    b.onclick = ()=>startLevel(i);
    box.appendChild(b);
  });
}
function startLevel(i){
  ensureAudio(); startMotion(); goFullscreen();
  loadLevel(i);
  pointers.clear(); jets.forEach(j=>j.held=false);
  state='play'; acc=0; document.body.classList.add('playing');
  show('title',false); show('win',false); show('menu',false); show('menuBtn',true);
}
function openMenu(){
  if (state!=='play') return;
  state='paused'; document.body.classList.remove('playing'); pointers.clear(); updateHeld(); refreshMenu(); show('menu',true);
}
function closeMenu(){ document.body.classList.add('playing'); state='play'; last=performance.now(); show('menu',false); }
function refreshMenu(){
  $('tiltBtn').textContent = 'Tilt: ' + (tiltOn?'On':'Off');
  $('soundBtn').textContent = 'Sound: ' + (soundOn?'On':'Off');
  updateSensorInfo();
}
function updateSensorInfo(){
  const inFrame = (()=>{ try { return window.self !== window.top; } catch(e){ return true; } })();
  const deg = Math.round(rawAngle*180/Math.PI);
  let msg = haveMotion ? `Tilt sensor active (${sensorSrc}, ${deg}°). Hold the phone how you like and tap “Set level tilt here”.`
    : 'No tilt data yet.' + (inFrame ? ' This page is inside an embedded viewer, which blocks motion sensors. Open it in the app build or as a standalone page.' : !window.isSecureContext ? ' The page is not on https, so Chrome blocks motion sensors.' : ' Try moving the phone a little.');
  $('tiltInfo').textContent = msg + `  [motion ${motionN} · orient ${orientN} · native ${nativeN}]`;
}
setInterval(()=>{ if (state==='paused') updateSensorInfo(); }, 300);
function winLevel(){
  state='win'; show('menuBtn',false); document.body.classList.remove('playing');
  const st = starsFor(lvlIdx, timer);
  save.best[lvlIdx] = Math.max(save.best[lvlIdx]||0, st);
  save.unlocked = Math.max(save.unlocked, Math.min(LEVELS.length, lvlIdx+2));
  persist();
  $('stars').innerHTML = [0,1,2].map(i=>`<span class="${i<st?'':'off'}">★</span>`).join('');
  const s = Math.floor(timer);
  $('winStats').textContent = `Time ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} · ${pumps} pumps · 3★ under ${LEVELS[lvlIdx].par}s`;
  const lastLvl = lvlIdx === LEVELS.length-1;
  $('winTitle').textContent = lastLvl ? 'You beat them all!' : 'Level clear!';
  $('nextBtn').textContent = lastLvl ? 'Play again' : 'Next';
  [0,1,2].forEach(i=>plink(880*Math.pow(1.26,i), i*0.13, 0.22));
  show('win',true);
}
function toTitle(){ document.body.classList.remove('playing'); state='title'; buildLevels(); show('menu',false); show('win',false); show('menuBtn',false); show('title',true); }

$('playBtn').onclick = ()=>startLevel(Math.min(save.unlocked-1, LEVELS.length-1));
$('menuBtn').onclick = openMenu;
$('resumeBtn').onclick = closeMenu;
$('restartBtn').onclick = ()=>startLevel(lvlIdx);
$('levelsBtn').onclick = toTitle;
$('winLevelsBtn').onclick = toTitle;
$('againBtn').onclick = ()=>startLevel(lvlIdx);
$('nextBtn').onclick = ()=>startLevel(lvlIdx===LEVELS.length-1 ? 0 : lvlIdx+1);
$('calBtn').onclick = ()=>{ neutral = rawAngle; saveOpts(); $('calBtn').textContent='Tilt set ✓'; setTimeout(()=>$('calBtn').textContent='Set level tilt here',1200); };
$('tiltBtn').onclick = ()=>{ tiltOn=!tiltOn; saveOpts(); refreshMenu(); };
$('flipBtn').onclick = ()=>{ tiltFlip=!tiltFlip; saveOpts(); $('flipBtn').textContent = tiltFlip?'Flip tilt ✓':'Flip tilt'; };
$('soundBtn').onclick = ()=>{ soundOn=!soundOn; if (master) master.gain.value = soundOn?0.8:0; saveOpts(); refreshMenu(); };
$('flipBtn').textContent = tiltFlip?'Flip tilt ✓':'Flip tilt';
document.addEventListener('visibilitychange', ()=>{ if (document.hidden && state==='play') openMenu(); });

loadLevel(0); buildLevels(); $('ver').textContent = VERSION;
requestAnimationFrame(frame);

// test hook
window.__game = { get state(){return state;}, get rings(){return rings;}, get pegs(){return pegs;}, jets, keys, get tilt(){return tilt;}, levels:LEVELS, floorY, get floorPeaks(){return FLOOR_PEAKS;}, get valleyX(){return VALLEY_X;}, get floor(){return FLOOR;}, setJet(v){JET=v;}, noz:NOZ, loadLevel, startLevel, step, landedCount };
</script>
